<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bg-grad-clean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1A1C"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="emerald-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#bg-grad-clean)" stroke="#243247" stroke-width="2"/>
  <circle cx="200" cy="110" r="70" fill="#34D399" fill-opacity="0.05" filter="url(#glow-c)"/>
  
  <!-- Outer Tech Diamond Circle -->
  <circle cx="200" cy="115" r="48" fill="#101623" stroke="url(#emerald-cyan)" stroke-width="3" filter="url(#glow-c)"/>
  
  <!-- Clean Sparkle / Wand Stars -->
  <path d="M200 85 L204 105 L224 109 L204 113 L200 133 L196 113 L176 109 L196 105 Z" 
        fill="url(#emerald-cyan)"/>
  <circle cx="218" cy="130" r="4" fill="#34D399"/>
  <circle cx="182" cy="132" r="3" fill="#06B6D4"/>
  
  <!-- Subtitle -->
  <text x="200" y="210" text-anchor="middle" fill="#EEF4FF" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">CLEANER &amp; TPM BYPASS</text>
</svg>
