<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bg-grad-temp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="blue-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow-t" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic"2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#bg-grad-temp)" stroke="#243247" stroke-width="2"/>
  <circle cx="200" cy="110" r="70" fill="#38BDF8" fill-opacity="0.05" filter="url(#glow-t)"/>
  
  <!-- Outer Tech Octagon -->
  <path d="M165 65 L235 65 L260 90 L260 140 L235 165 L165 165 L140 140 L140 90 Z" 
        fill="#101623" stroke="url(#blue-glow)" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Lightning Bolt -->
  <path d="M205 75 L180 115 L200 115 L195 155 L222 110 L202 110 Z" 
        fill="url(#blue-glow)" filter="url(#glow-t)"/>
  
  <!-- Subtitle -->
  <text x="200" y="210" text-anchor="middle" fill="#EEF4FF" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">TEMP SPOOFER</text>
</svg>
